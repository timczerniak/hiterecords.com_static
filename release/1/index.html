<script>
	function transition() {
		clearTimeout($.slideshow_timeout);
		var imgs = $("div.slideshow").children("div.slideshow_image");
		if ($.slideshow_index == imgs.length) {
			$.slideshow_index = 1;
		} else {
			$.slideshow_index ++;
		}
		imgs.fadeOut($.slideshow_transition);
		$("div.slideshow div.slideshow_image:nth-child(" + $.slideshow_index + ")").fadeIn($.slideshow_transition);
		$.slideshow_timeout = setTimeout("transition()", $.slideshow_duration);
	}
	
	$(document).ready(function() {
		var imgs = $("div.slideshow").children("div.slideshow_image");
		if (imgs.length > 1) {
			$("div.slideshow").click(function() { transition(); });
			imgs.hide();
			$("div.slideshow div.slideshow_image:nth-child(1)").show();
			$.slideshow_index = 1;
			$.slideshow_transition = 1000;
			$.slideshow_duration = 4000;
			$.slideshow_timeout = setTimeout("transition()", $.slideshow_duration);
		}
	});
</script>
